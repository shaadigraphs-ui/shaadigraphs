<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Client Onboarding | SHAADIGRAPHS</title>
  <link rel="icon" type="image/png" href="images/chhotkadil.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />

  <style>
    body { background-color: #0a0b0e; color: #f4efe6; font-family: 'Plus Jakarta Sans', sans-serif; }
    .onboard-container { max-width: 650px; margin: 40px auto; padding: 20px; }
    .portal-card {
      background: linear-gradient(180deg, rgba(255, 45, 117, 0.08), transparent 28%), #12141a;
      padding: 36px 26px;
      border-radius: 18px;
      border: 1px solid rgba(255, 45, 117, 0.3);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.6);
    }
    .portal-eyebrow { color: #ff2d75; font-size: 0.75rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; display: inline-block; margin-bottom: 8px; }
    .portal-card-title { font-size: 1.8rem; font-family: 'Cinzel', serif; margin-bottom: 8px; color: #f4efe6; }
    .portal-card-copy { font-size: 0.9rem; color: #a2aab8; margin-bottom: 24px; line-height: 1.5; }
    .portal-form { display: flex; flex-direction: column; gap: 12px; text-align: left; }
    .portal-label { font-size: 0.72rem; color: #ff6699; font-weight: 700; letter-spacing: 1.1px; margin-top: 8px; }
    .portal-input { width: 100%; padding: 12px 14px; background: #0d0f14; border: 1px solid rgba(255, 45, 117, 0.25); border-radius: 10px; color: #f4efe6; font-size: 0.95rem; outline: none; box-sizing: border-box; }
    .portal-input:focus { border-color: #ff2d75; box-shadow: 0 0 0 3px rgba(255, 45, 117, 0.2); }
    
    .date-picker-input { cursor: pointer; color: #8e95a5; background-color: #0d0f14; }
    .date-picker-input.has-value { color: #f4efe6; }

    .portal-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px 16px; border-radius: 12px; font-weight: 700; font-size: 0.95rem; cursor: pointer; border: none; transition: all 0.2s ease; text-decoration: none; }
    .portal-btn-primary { background: linear-gradient(135deg, #ff2d75, #db296f); color: #ffffff; box-shadow: 0 8px 22px rgba(255, 45, 117, 0.35); }
    .portal-btn-whatsapp { background: linear-gradient(135deg, #25d366, #128c7e); color: #ffffff; box-shadow: 0 8px 22px rgba(37, 211, 102, 0.35); }
    .portal-btn-ghost { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(244, 239, 230, 0.14); color: #f4efe6; }
    .portal-btn-compact { width: auto; padding: 8px 14px; font-size: 0.8rem; }
  </style>
</head>
<body class="portal-app">

  <header class="header portal-header" style="background: rgba(13, 15, 18, 0.78); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 50px; margin: 14px 24px; padding: 8px 24px; backdrop-filter: blur(18px);">
    <div class="container nav-wrap portal-nav" style="display: flex; justify-content: space-between; align-items: center;">
      <a href="index.html" class="brand-logo-wrap">
        <img src="images/Shaadigraphs-white-logo.png" alt="Shaadigraphs Logo" class="main-site-logo" style="height: 44px;" />
      </a>
      <a href="index.html" class="portal-back-link" style="color: #ff6699; text-decoration: none; font-size: 0.82rem; font-weight: 600;">
        <i class="fas fa-arrow-left"></i> Back to Home
      </a>
    </div>
  </header>

  <main class="portal-main onboard-container">
    <div id="onboard-loading" class="portal-card" style="text-align: center; padding: 50px 20px;">
      <i class="fas fa-circle-notch fa-spin" style="font-size: 2rem; color: #ff2d75; margin-bottom: 12px;"></i>
      <h3>Verifying Secure Onboarding Link...</h3>
    </div>

    <div id="onboard-screen-container" class="portal-card" style="display: none;"></div>
  </main>

  <footer class="site-footer portal-footer" style="text-align: center; padding: 20px 0; border-top: 1px solid rgba(255,255,255,0.06);">
    <p>© 2026 Shaadigraphs. All Rights Reserved.</p>
  </footer>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxiicife5FUbMsQZqzio27S5_FOxf-b7D5dXFNLWs5g9ehpVcDs4Hif5X98pG9KDdFW/exec";
    let currentActiveClient = null;
    let globalSubmittedEventsSummary = "";

    function cleanDigits(val) {
      if (!val) return '';
      return String(val).replace(/\D/g, '').trim();
    }

    function initOnboarding() {
      const params = new URLSearchParams(window.location.search);
      const urlPhone = cleanDigits(params.get('phone'));
      const urlPin = cleanDigits(params.get('pin'));

      if (!urlPhone || !urlPin) {
        document.getElementById('onboard-loading').innerHTML = `<h3 style="color: #ff4d6d;">Invalid or Missing Onboarding Link</h3><p style="color: #a2aab8; margin-top: 10px;">Please check your WhatsApp link or contact the studio.</p>`;
        return;
      }

      const script = document.createElement('script');
      script.src = `${API_URL}?action=getClients&callback=handleOnboardClientData&_t=${Date.now()}`;
      document.body.appendChild(script);
    }

    window.handleOnboardClientData = function(data) {
      if (data && data.clients) {
        const params = new URLSearchParams(window.location.search);
        const urlPhone = cleanDigits(params.get('phone'));
        const urlPin = cleanDigits(params.get('pin'));

        const match = data.clients.find(c => c.phone === urlPhone && c.pin === urlPin);
        if (match) {
          currentActiveClient = match;
          
          const hasVenue = match.venue && String(match.venue).trim() !== "";
          const hasEvents = (match.dateWedding || match.dateEngagement || match.dateHaldi || match.dateMehandi || match.dateSangeet || match.datePrewed || match.datePooja || match.dateMatkor || match.dateTilak || match.dateRoka || match.dateReception || match.dateVidai || match.dateAnniversary || match.dateBirthday || match.dateGrihaPravesh);

          if (hasVenue && hasEvents) {
            renderLockedScreen();
          } else {
            renderOnboardForm();
          }
        } else {
          document.getElementById('onboard-loading').innerHTML = `<h3 style="color: #ff4d6d;">Client Record Not Found</h3><p style="color: #a2aab8; margin-top: 10px;">The details associated with this link could not be verified.</p>`;
        }
      }
    };

    function renderLockedScreen() {
      document.getElementById('onboard-loading').style.display = 'none';
      const onboardBox = document.getElementById('onboard-screen-container');
      onboardBox.style.display = 'block';

      const studioPhone = "918540087250";
      const waMessage = `Hello Shaadigraphs, my onboarding details for ${currentActiveClient.name || 'our wedding'} are already submitted and locked.`;
      const waUrl = `https://wa.me/${studioPhone}?text=${encodeURIComponent(waMessage)}`;

      onboardBox.innerHTML = `
        <div style="text-align: center; padding: 20px 0;">
          <i class="fas fa-lock" style="font-size: 3rem; color: #c9a84c; margin-bottom: 16px;"></i>
          <h2 class="portal-card-title">Details Already Locked!</h2>
          <p class="portal-card-copy" style="line-height: 1.8; margin-top: 14px;">
            Your wedding onboarding details and event schedules have already been submitted and secured with Shaadigraphs.<br/><br/>
            If you need to make any urgent changes, please contact the studio directly via WhatsApp.
          </p>
          <div style="margin-top: 30px; display: flex; flex-direction: column; gap: 12px; align-items: center;">
            <a href="${waUrl}" target="_blank" class="portal-btn portal-btn-whatsapp" style="max-width: 320px; text-decoration: none;">
              <i class="fab fa-whatsapp" style="font-size: 1.2rem;"></i> Contact Studio
            </a>
            <a href="index.html" class="portal-btn portal-btn-ghost" style="display: inline-flex; width: auto; padding: 10px 24px; text-decoration: none; margin-top: 10px;">
              <i class="fas fa-home"></i> Back to Home
            </a>
          </div>
        </div>
      `;
    }

    function renderOnboardForm() {
      document.getElementById('onboard-loading').style.display = 'none';
      const onboardBox = document.getElementById('onboard-screen-container');
      onboardBox.style.display = 'block';

      const bookingTotal = currentActiveClient.totalAmount || currentActiveClient.total || 0;
      const advancePaid = currentActiveClient.advancePaid || currentActiveClient.advance || 0;
      const balanceDue = bookingTotal - advancePaid;

      onboardBox.innerHTML = `
        <div style="text-align: center; margin-bottom: 20px;">
          <span class="eyebrow portal-eyebrow">SHAADIGRAPHS • CLIENT ONBOARDING</span>
          <h2 class="portal-card-title">${currentActiveClient.name || 'Welcome Couple'}</h2>
          <p class="portal-card-copy" style="margin-bottom: 10px;">Please verify your details and select your custom event dates below.</p>
        </div>

        <div style="background: rgba(201, 168, 76, 0.08); border: 1px solid rgba(201, 168, 76, 0.3); border-radius: 12px; padding: 16px; margin-bottom: 24px;">
          <div style="font-size: 0.75rem; color: #c9a84c; font-weight: 700; text-transform: uppercase; margin-bottom: 8px;">
            <i class="fas fa-file-invoice-dollar"></i> Booking Summary & Commercials
          </div>
          <div style="display: flex; justify-content: space-between; font-size: 0.88rem; margin-bottom: 6px; color: #f4efe6;">
            <span>Total Booking Value:</span>
            <strong>₹${Number(bookingTotal).toLocaleString('en-IN')}</strong>
          </div>
          <div style="display: flex; justify-content: space-between; font-size: 0.88rem; margin-bottom: 6px; color: #25d366;">
            <span>Advance Paid:</span>
            <strong>₹${Number(advancePaid).toLocaleString('en-IN')}</strong>
          </div>
          <div style="display: flex; justify-content: space-between; font-size: 0.88rem; border-top: 1px dashed rgba(255,255,255,0.15); padding-top: 6px; color: #ef4444;">
            <span>Balance Due:</span>
            <strong>₹${Number(balanceDue).toLocaleString('en-IN')}</strong>
          </div>
        </div>

        <form id="client-onboard-form" class="portal-form" onsubmit="submitClientOnboardForm(event)">
          <label class="portal-label">BRIDE'S FULL NAME *</label>
          <input type="text" id="onb-bride" class="portal-input" value="${currentActiveClient.bride || ''}" placeholder="e.g. Ruhi" required />

          <label class="portal-label">GROOM'S FULL NAME *</label>
          <input type="text" id="onb-groom" class="portal-input" value="${currentActiveClient.groom || ''}" placeholder="e.g. Rishu" required />

          <label class="portal-label">VENUE ADDRESS *</label>
          <textarea id="onb-venue" class="portal-input" placeholder="e.g. Grand Palace Lawn, Boring Road, Patna" rows="2" required style="resize: vertical;">${currentActiveClient.venue || ''}</textarea>

          <label class="portal-label">INSTAGRAM HANDLE *</label>
          <input type="text" id="onb-insta" class="portal-input" value="${currentActiveClient.instagram || ''}" placeholder="e.g. @couple_handle" required />

          <div style="margin-top: 8px;">
            <label class="portal-label">BIRTHDAY (GROOM) *</label>
            <input type="text" id="onb-dob-groom" class="portal-input date-picker-input" value="${currentActiveClient.dobGroom || ''}" placeholder="Select Date (DD-MM-YYYY)" readonly onclick="openCalendarPicker(this)" required />
            <input type="date" id="hidden-dob-groom" value="${currentActiveClient.dobGroom || ''}" style="display:none;" onchange="syncDateValue(this, 'onb-dob-groom')" />
          </div>
          <div style="margin-top: 8px;">
            <label class="portal-label">BIRTHDAY (BRIDE) *</label>
            <input type="text" id="onb-dob-bride" class="portal-input date-picker-input" value="${currentActiveClient.dobBride || ''}" placeholder="Select Date (DD-MM-YYYY)" readonly onclick="openCalendarPicker(this)" required />
            <input type="date" id="hidden-dob-bride" value="${currentActiveClient.dobBride || ''}" style="display:none;" onchange="syncDateValue(this, 'onb-dob-bride')" />
          </div>

          <label class="portal-label" style="margin-top: 20px; color: #c9a84c;"><i class="fas fa-calendar-alt"></i> ADD EVENT DATES & SCHEDULES *</label>
          <p style="font-size: 0.8rem; color: #8e95a5; margin-bottom: 12px;">Add at least one event date using the button below:</p>

          <div id="dynamic-events-container" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px;"></div>

          <button type="button" class="portal-btn portal-btn-ghost portal-btn-compact" onclick="addEventRow()" style="width: auto; margin-bottom: 20px;">
            <i class="fas fa-plus"></i> Add Event
          </button>

          <div style="margin-top: 25px;">
            <button type="submit" class="portal-btn portal-btn-primary" id="onb-submit-btn">
              <i class="fas fa-check-circle"></i> Submit
            </button>
          </div>
        </form>
      `;
      
      ['onb-dob-groom', 'onb-dob-bride'].forEach(id => {
        const el = document.getElementById(id);
        if (el && el.value) {
          const hidId = 'hidden-' + id.replace('onb-', '');
          const hid = document.getElementById(hidId);
          if (hid) hid.value = el.value;
          el.value = formatDateDDMMYYYY(el.value);
          el.classList.add('has-value');
        }
      });

      addEventRow();
    }

    function formatDateDDMMYYYY(dateStr) {
      if (!dateStr) return "";
      const parts = dateStr.split('-');
      if (parts.length === 3) {
        return `${parts[2]}-${parts[1]}-${parts[0]}`;
      }
      return dateStr;
    }

    function openCalendarPicker(displayInput) {
      const idStr = displayInput.id.replace('onb-', '');
      const hiddenInput = document.getElementById('hidden-' + idStr);
      if (hiddenInput) {
        if (typeof hiddenInput.showPicker === 'function') {
          hiddenInput.showPicker();
        } else {
          hiddenInput.click();
        }
      }
    }

    function syncDateValue(hiddenInput, displayInputId) {
      const displayInput = document.getElementById(displayInputId);
      if (displayInput && hiddenInput.value) {
        displayInput.value = formatDateDDMMYYYY(hiddenInput.value);
        displayInput.classList.add('has-value');
      }
    }

    function addEventRow(selectedEvent = "", customName = "", eventDate = "") {
      const container = document.getElementById('dynamic-events-container');
      if (!container) return;

      const uniqueKey = Date.now() + Math.random().toString(36).substr(2, 4);
      const rowId = 'ev-row-' + uniqueKey;
      const rowDiv = document.createElement('div');
      rowDiv.id = rowId;
      rowDiv.style.cssText = "display: flex; gap: 10px; align-items: center; background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08);";

      let formattedDisplayDate = eventDate ? formatDateDDMMYYYY(eventDate) : "";

      rowDiv.innerHTML = `
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
          <select class="portal-input event-select-dropdown" style="padding: 8px 10px; font-size: 0.85rem;" required>
            <option value="">-- Select Event --</option>
            <option value="Wedding" ${selectedEvent === 'Wedding' ? 'selected' : ''}>Wedding</option>
            <option value="Engagement" ${selectedEvent === 'Engagement' ? 'selected' : ''}>Engagement</option>
            <option value="Haldi Ceremony" ${selectedEvent === 'Haldi Ceremony' ? 'selected' : ''}>Haldi Ceremony</option>
            <option value="Mehandi Ceremony" ${selectedEvent === 'Mehandi Ceremony' ? 'selected' : ''}>Mehandi Ceremony</option>
            <option value="Sangeet & Cocktail Night" ${selectedEvent === 'Sangeet & Cocktail Night' ? 'selected' : ''}>Sangeet & Cocktail Night</option>
            <option value="Pre-Wedding" ${selectedEvent === 'Pre-Wedding' ? 'selected' : ''}>Pre-Wedding</option>
            <option value="Pooja & Hawan" ${selectedEvent === 'Pooja & Hawan' ? 'selected' : ''}>Pooja & Hawan</option>
            <option value="Matkor" ${selectedEvent === 'Matkor' ? 'selected' : ''}>Matkor</option>
            <option value="Tilak" ${selectedEvent === 'Tilak' ? 'selected' : ''}>Tilak</option>
            <option value="Roka" ${selectedEvent === 'Roka' ? 'selected' : ''}>Roka</option>
            <option value="Reception" ${selectedEvent === 'Reception' ? 'selected' : ''}>Reception</option>
            <option value="Vidai" ${selectedEvent === 'Vidai' ? 'selected' : ''}>Vidai</option>
            <option value="Anniversary" ${selectedEvent === 'Anniversary' ? 'selected' : ''}>Anniversary</option>
            <option value="Birthday" ${selectedEvent === 'Birthday' ? 'selected' : ''}>Birthday</option>
            <option value="Griha Pravesh" ${selectedEvent === 'Griha Pravesh' ? 'selected' : ''}>Griha Pravesh</option>
          </select>
        </div>
        <div style="flex: 1;">
          <input type="text" id="display-date-${uniqueKey}" class="portal-input date-picker-input event-display-date" value="${formattedDisplayDate}" placeholder="Select Date (DD-MM-YYYY)" readonly onclick="openDynamicCalendar('${uniqueKey}')" style="padding: 8px 10px; font-size: 0.85rem;" required />
          <input type="date" id="hidden-date-${uniqueKey}" value="${eventDate}" style="display:none;" onchange="syncDynamicDate('${uniqueKey}')" />
        </div>
        <button type="button" onclick="document.getElementById('${rowId}').remove()" style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444; width: 34px; height: 34px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center;">
          <i class="fas fa-trash-alt" style="font-size: 0.8rem;"></i>
        </button>
      `;
      container.appendChild(rowDiv);

      const disp = document.getElementById(`display-date-${uniqueKey}`);
      if (disp && disp.value) disp.classList.add('has-value');
    }

    function openDynamicCalendar(uniqueKey) {
      const hiddenInput = document.getElementById(`hidden-date-${uniqueKey}`);
      if (hiddenInput) {
        if (typeof hiddenInput.showPicker === 'function') {
          hiddenInput.showPicker();
        } else {
          hiddenInput.click();
        }
      }
    }

    function syncDynamicDate(uniqueKey) {
      const hiddenInput = document.getElementById(`hidden-date-${uniqueKey}`);
      const displayInput = document.getElementById(`display-date-${uniqueKey}`);
      if (hiddenInput && displayInput && hiddenInput.value) {
        displayInput.value = formatDateDDMMYYYY(hiddenInput.value);
        displayInput.classList.add('has-value');
      }
    }

    function submitClientOnboardForm(e) {
      if (e && e.preventDefault) e.preventDefault();

      const brideVal = document.getElementById('onb-bride').value.trim();
      const groomVal = document.getElementById('onb-groom').value.trim();
      const venueVal = document.getElementById('onb-venue').value.trim();
      const instaVal = document.getElementById('onb-insta').value.trim();
      const dobGroomVal = document.getElementById('hidden-dob-groom').value.trim();
      const dobBrideVal = document.getElementById('hidden-dob-bride').value.trim();

      if (!brideVal || !groomVal || !venueVal || !instaVal || !dobGroomVal || !dobBrideVal) {
        alert("Please fill all required fields completely!");
        return;
      }

      const eventRows = document.querySelectorAll('#dynamic-events-container > div');
      if (eventRows.length === 0) {
        alert("Please add at least one event date!");
        return;
      }

      let validEventCount = 0;
      eventRows.forEach(row => {
        const select = row.querySelector('.event-select-dropdown');
        const hiddenDateInput = row.querySelector('input[type="date"]');
        if (select && hiddenDateInput && select.value.trim() && hiddenDateInput.value.trim()) {
          validEventCount++;
        }
      });

      if (validEventCount === 0) {
        alert("Please select at least one valid Event and Date!");
        return;
      }

      const btn = document.getElementById('onb-submit-btn');
      btn.innerText = "Saving Data...";
      btn.disabled = true;

      const pinVal = currentActiveClient.pin;
      let eventMap = {
        wedding: "", engagement: "", haldi: "", mehandi: "", sangeet: "",
        prewed: "", pooja: "", matkor: "", tilak: "", roka: "",
        reception: "", vidai: "", anniversary: "", birthday: "", grihapravesh: ""
      };

      let summaryList = [];

      eventRows.forEach(row => {
        const select = row.querySelector('.event-select-dropdown');
        const hiddenDateInput = row.querySelector('input[type="date"]');
        
        if (!select || !hiddenDateInput) return;
        
        let eventType = select.value.trim();
        let eventDate = hiddenDateInput.value.trim();
        if (!eventType || !eventDate) return;

        summaryList.push(`• ${eventType}: ${formatDateDDMMYYYY(eventDate)}`);

        let cleanType = eventType.toLowerCase();

        if (cleanType === 'wedding') eventMap.wedding = eventDate;
        else if (cleanType === 'engagement') eventMap.engagement = eventDate;
        else if (cleanType === 'haldi ceremony') eventMap.haldi = eventDate;
        else if (cleanType === 'mehandi ceremony') eventMap.mehandi = eventDate;
        else if (cleanType === 'sangeet & cocktail night') eventMap.sangeet = eventDate;
        else if (cleanType === 'pre-wedding') eventMap.prewed = eventDate;
        else if (cleanType === 'pooja & hawan') eventMap.pooja = eventDate;
        else if (cleanType === 'matkor') eventMap.matkor = eventDate;
        else if (cleanType === 'tilak') eventMap.tilak = eventDate;
        else if (cleanType === 'roka') eventMap.roka = eventDate;
        else if (cleanType === 'reception') eventMap.reception = eventDate;
        else if (cleanType === 'vidai') eventMap.vidai = eventDate;
        else if (cleanType === 'anniversary') eventMap.anniversary = eventDate;
        else if (cleanType === 'birthday') eventMap.birthday = eventDate;
        else if (cleanType === 'griha pravesh') eventMap.grihapravesh = eventDate;
      });

      const globalSubmittedEventsSummary = summaryList.join("\n");
      const displayName = `${groomVal} ❤️ ${brideVal}`;
      const currentStageVal = currentActiveClient.currentStage || "Pre-Production & Planning";
      const limitVal = (currentStageVal.includes("Selection") || currentStageVal.includes("Photo Selection")) ? (currentActiveClient.limit || 100) : "";

      const postData = {
        action: "updateClientFull",
        phone: currentActiveClient.phone,
        pin: pinVal,
        name: displayName,
        bride: brideVal,
        groom: groomVal,
        driveLink: currentActiveClient.driveLink || "",
        limit: limitVal,
        booking: currentActiveClient.bookingAmount || 0,
        advance: currentActiveClient.advancePaid || 0,
        total: currentActiveClient.totalAmount || 0,
        delivery: currentActiveClient.deliveryDate || "",
        stage: currentStageVal,
        video: currentActiveClient.videoDownloadLink || "",
        venue: venueVal,
        insta: instaVal,
        dobGroom: dobGroomVal,
        dobBride: dobBrideVal,
        dateWedding: eventMap.wedding,
        dateEngagement: eventMap.engagement,
        dateHaldi: eventMap.haldi,
        dateMehandi: eventMap.mehandi,
        dateSangeet: eventMap.sangeet,
        datePrewed: eventMap.prewed,
        datePooja: eventMap.pooja,
        dateMatkor: eventMap.matkor,
        dateTilak: eventMap.tilak,
        dateRoka: eventMap.roka,
        dateReception: eventMap.reception,
        dateVidai: eventMap.vidai,
        dateAnniversary: eventMap.anniversary,
        dateBirthday: eventMap.birthday,
        dateGrihaPravesh: eventMap.grihapravesh
      };

      fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(postData)
      })
      .then(() => {
        onOnboardSubmittedDone(globalSubmittedEventsSummary, venueVal);
      })
      .catch((error) => {
        console.error("Error saving schedules:", error);
        alert("An error occurred. Please try again.");
        btn.innerText = "Submit";
        btn.disabled = false;
      });
    }

    function onOnboardSubmittedDone(summaryText, venueVal) {
      const onboardBox = document.getElementById('onboard-screen-container');
      if (onboardBox) {
        let eventsHtmlList = summaryText.split('\n').map(item => `<div style="padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 0.9rem; color: #f4efe6;">${item}</div>`).join('');

        const studioPhone = "918540087250";
        const waMessage = `Hello Shaadigraphs,\nI have successfully submitted my wedding onboarding details.\n\nSelected Events & Dates:\n${summaryText}\n\nPlease review and confirm my booking.`;
        const waUrl = `https://wa.me/${studioPhone}?text=${encodeURIComponent(waMessage)}`;

        onboardBox.innerHTML = `
          <div style="text-align: center; margin-bottom: 20px;">
            <span class="eyebrow portal-eyebrow">REVIEW YOUR DETAILS</span>
            <h2 class="portal-card-title">Confirm Your Schedule</h2>
            <p class="portal-card-copy" style="margin-bottom: 10px;">Please review your submitted events and venue address below before final confirmation.</p>
          </div>

          <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255, 45, 117, 0.2); border-radius: 12px; padding: 18px; margin-bottom: 24px; text-align: left;">
            <div style="font-size: 0.75rem; color: #ff6699; font-weight: 700; text-transform: uppercase; margin-bottom: 8px;">
              <i class="fas fa-map-marker-alt"></i> Venue Address
            </div>
            <p style="font-size: 0.9rem; color: #f4efe6; margin-bottom: 16px; line-height: 1.4;">${venueVal}</p>

            <div style="font-size: 0.75rem; color: #ff6699; font-weight: 700; text-transform: uppercase; margin-bottom: 8px;">
              <i class="fas fa-calendar-alt"></i> Selected Events & Dates
            </div>
            <div style="margin-bottom: 8px;">
              ${eventsHtmlList}
            </div>
          </div>

          <div style="display: flex; gap: 12px;">
            <button type="button" class="portal-btn portal-btn-whatsapp" onclick="window.open('${waUrl}', '_blank')" style="flex: 1;">
              <i class="fab fa-whatsapp"></i> Confirm & Send
            </button>
          </div>
        `;
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      initOnboarding();
    });
  </script>
</body>
</html>
